    <div class="field">
      <label for="contact-nom">Nom (requis)</label>
      <input id="contact-nom" name="nom" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="contact-email">Votre adresse e-mail (requis)</label>
      <input id="contact-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="contact-subject">Sujet (requis)</label>
      <input id="contact-subject" name="subject" type="text" required>
    </div>
    <div class="field">
      <label for="contact-message">Message (requis)</label>
      <textarea id="contact-message" name="message" rows="6" required></textarea>
    </div>
