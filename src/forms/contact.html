    <div class="field">
      <label for="contact-nom">Nom (obligatoire)</label>
      <input id="contact-nom" name="nom" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="contact-email">Votre adresse e-mail (obligatoire)</label>
      <input id="contact-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="contact-message">Message (obligatoire)</label>
      <textarea id="contact-message" name="message" rows="6" required></textarea>
    </div>
